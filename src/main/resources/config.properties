# 密码管理器配置文件

# 超时设置（分钟）
session.timeout=5

# 密码生成默认设置
password.default.length=16
password.default.uppercase=true
password.default.lowercase=true
password.default.digits=true
password.default.special=true

# 剪贴板设置（秒）
clipboard.clear.timeout=30

# 界面设置
ui.theme=default
ui.language=zh_CN

# 数据库设置
database.name=password_manager.db
database.path=./data